name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - '*'
jobs:
  biome:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm
      # ロックファイルと package.json が一致しない場合と、peer依存が衝突する場合は失敗する
      - run: npm ci
      - run: npm run biome
  tsc:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm
      # ロックファイルと package.json が一致しない場合と、peer依存が衝突する場合は失敗する
      - run: npm ci
      - run: npm run tsc
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm
      # ロックファイルと package.json が一致しない場合と、peer依存が衝突する場合は失敗する
      - run: npm ci
      - run: npm run test
  # 本番データ（Apps Script）の整合性チェック。リリースPRで、追加したデータの確認に使う。
  # 依存と無関係な理由（データの不整合、Apps Script の応答の不安定さ）で自動マージが
  # 止まらないよう、Renovate のPRでは実行しない（スキップされたジョブは必須チェック上は成功扱い）
  data:
    if: ${{ github.event.pull_request.user.login != 'renovate[bot]' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm
      # ロックファイルと package.json が一致しない場合と、peer依存が衝突する場合は失敗する
      - run: npm ci
      - run: npm run test:data
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm
      # ロックファイルと package.json が一致しない場合と、peer依存が衝突する場合は失敗する
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # フィクスチャを使ってビルドし、next start に対して実行する（playwright.config.ts の webServer）
      - run: npm run e2e
      # next dev に対するスモークテスト
      - run: npm run e2e:dev
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  # スクリーンショット比較。ベースライン（e2e/vrt/screenshots）と同じ環境で撮るため、
  # Playwright 公式のイメージの中で実行する。イメージのバージョンは @playwright/test に合わせる
  vrt:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      E2E_TARGET: vrt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm
      # ロックファイルと package.json が一致しない場合と、peer依存が衝突する場合は失敗する
      - run: npm ci
      # 差分が出たら、成果物のHTMLレポートで期待画像・実際の画像・差分画像を確認する
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: vrt-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
