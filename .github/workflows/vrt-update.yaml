name: Update VRT baselines
# スクリーンショット比較のベースライン（e2e/vrt/screenshots）を、選んだブランチの上で作り直してコミットする。
# 見た目の変化が意図したものだと確認できたときに、手動で起動する（README を参照）。
# 標準のトークンで作ったコミットではCIが起動しないので、プッシュされた後にCIを手動で再実行する
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # CI の vrt ジョブと同じイメージ
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    env:
      E2E_TARGET: vrt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - uses: actions/cache@v4
        id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
      - run: yarn install --pure-lockfile
      - run: yarn playwright test --update-snapshots
      - name: Commit and push
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/vrt/screenshots
          if git diff --cached --quiet; then
            echo 'ベースラインに変更はありません' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '更新したベースライン:'
            git diff --cached --name-only | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
          git commit -m 'test: VRTのベースラインを更新する'
          git push
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: vrt-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
